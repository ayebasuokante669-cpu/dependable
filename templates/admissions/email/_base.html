{% comment %}
The HTML half of every parent-facing admissions email.

Table-based, inline-styled and deliberately plain: mail clients strip <style>
blocks, ignore flexbox and cache nothing, so the design system that serves the
app is no use here. What carries over is the palette, so an email and the
school's own enquiry page look like they came from the same place.

The school signs it. SCHOOLCORD appears nowhere — see
apps/admissions/notifications.py for why that rule holds even in the From line.

Pages fill `greeting`, `body` and optionally `panel`.
{% endcomment %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ school.name }}</title>
</head>
<body style="margin:0;padding:0;background-color:#f6f8fb;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
         style="background-color:#f6f8fb;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
               style="max-width:560px;background-color:#ffffff;border:1px solid #dfe4ed;
                      border-radius:8px;font-family:'Public Sans',Helvetica,Arial,sans-serif;
                      color:#1c2432;">

          <tr>
            <td style="padding:24px 28px 8px;border-bottom:1px solid #eef1f6;">
              <p style="margin:0;font-size:18px;font-weight:600;color:#0f2547;">
                {{ school.name }}
              </p>
              {% if branch %}
                <p style="margin:2px 0 16px;font-size:13px;color:#6b7891;">
                  {{ branch.name }}
                </p>
              {% else %}
                <div style="height:16px;"></div>
              {% endif %}
            </td>
          </tr>

          <tr>
            <td style="padding:24px 28px;font-size:15px;line-height:1.6;color:#2e3849;">
              <p style="margin:0 0 16px;">{% block greeting %}Dear {{ applicant.parent_name }},{% endblock %}</p>

              {% block body %}{% endblock %}

              {% block panel %}{% endblock %}

              <p style="margin:24px 0 0;">Warm regards,</p>
              <p style="margin:2px 0 0;font-weight:600;color:#0f2547;">{{ school.name }}</p>
            </td>
          </tr>

          {% if office_phone or office_email %}
            <tr>
              <td style="padding:16px 28px 24px;border-top:1px solid #eef1f6;
                         font-size:13px;color:#5a6b85;">
                {% if office_phone %}
                  Call <a href="tel:{{ office_phone }}"
                          style="color:#1d3f79;">{{ office_phone }}</a>{% if office_email %} &middot; {% endif %}
                {% endif %}
                {% if office_email %}
                  Email <a href="mailto:{{ office_email }}"
                           style="color:#1d3f79;">{{ office_email }}</a>
                {% endif %}
              </td>
            </tr>
          {% endif %}
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
