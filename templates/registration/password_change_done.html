{% extends "base.html" %}

{% block page_title %}Password changed{% endblock %}

{% block content %}
<div class="mx-auto max-w-lg">
  <div class="card empty-state">
    <p class="text-base font-medium text-ink-700">Your password has been changed</p>
    <p class="mx-auto mt-1 max-w-md text-sm">
      Use the new one next time you sign in. This device stays signed in.
    </p>
    <a href="{% url 'core:dashboard' %}" class="btn btn-primary mt-5 text-sm">
      Back to your dashboard
    </a>
  </div>
</div>
{% endblock %}
