{% load static %}{% comment %}
The server's password policy, handed to the browser so the checklist in
static/js/password.js states the real minimum rather than a copy of it that can
drift. Rendered as application/json rather than a <script> that assigns a
global: the contents are parsed as data and never executed.

Included wherever a "set a password" field can appear -- which is the whole
signed-in shell and every signed-out auth screen, since both are served from
base.html, plus the admin via templates/admin/base_site.html.
{% endcomment %}
{{ password_policy|json_script:"password-policy" }}
<link rel="stylesheet" href="{% static 'css/password-controls.css' %}">
<script src="{% static 'js/password.js' %}" defer></script>
