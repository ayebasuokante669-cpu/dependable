{% comment %}
One form field with its label, hint and errors. Widget classes come from
StyledFormMixin, so this stays markup-only.
{% endcomment %}
<div>
  <label for="{{ field.id_for_label }}" class="field-label">
    {{ field.label }}
    {% if field.field.required %}<span class="text-overdue" aria-hidden="true">*</span>{% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}<p class="field-hint">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
</div>
