{% comment %}
The "this goes somewhere" cue on a clickable tile. Hidden from assistive tech:
the tile is an <a> whose text already says where it goes, so announcing an
arrow as well would only add noise.
{% endcomment %}
<svg class="size-3.5 shrink-0 -translate-x-1 text-ink-400 opacity-0
            transition-all duration-150 group-hover:translate-x-0
            group-hover:opacity-100 group-focus-visible:translate-x-0
            group-focus-visible:opacity-100"
     fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"
     aria-hidden="true">
  <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
</svg>
